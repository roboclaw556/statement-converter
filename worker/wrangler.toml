# Email import worker. Needs Workers Paid ($5/mo): PDF parsing exceeds the free plan's 10 ms CPU limit.
name = "statement-converter-email"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
BRAND = "StatementOtter"
SITE_URL = "https://statementotter.com"

[[d1_databases]]
binding = "DB"
database_name = "statement-converter"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
