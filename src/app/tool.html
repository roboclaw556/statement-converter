  <section class="tool" id="tool" data-default-date-order="{{dateOrder}}" data-default-format="{{format}}">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
      <span class="drop-title">Drop PDF bank statements here</span>
      <span class="drop-sub">or click to choose files. Text-based PDFs from any bank.</span>
      <span class="privacy">🔒 Converted on your device. Your statement is never uploaded.</span>
    </label>

    <form class="password" id="password" hidden>
      <label>This PDF is password protected. Enter its password:
        <input type="password" id="pw" autocomplete="off">
      </label>
      <button type="submit">Open</button>
    </form>

    <div class="files" id="files" hidden></div>

    <div class="result" id="result" hidden>
      <div class="status" id="status" role="status"></div>
      <dl class="totals" id="totals"></dl>
      <div class="warnings" id="warnings"></div>

      <div class="controls">
        <label>Dates are
          <select id="dateOrder">
            <option value="MDY">month first (01/31)</option>
            <option value="DMY">day first (31/01)</option>
          </select>
        </label>
        <span class="hint">Click any description or amount to correct it. The balance check updates as you type.</span>
      </div>

      <div class="exports" id="exports">
        <span id="quickExports"></span>
        <label class="more">More formats
          <select id="moreFormat"></select>
        </label>
        <button type="button" id="moreDownload">Download</button>
      </div>

      <div class="limit" id="limitNote" hidden></div>

      <div class="pro-bar" id="proBar">
        <button type="button" data-pro="ai">Categorize the rest with AI</button>
        <button type="button" data-pro="lender">Lender report</button>
        <button type="button" data-pro="fraud">Tamper check</button>
        <button type="button" data-pro="push-quickbooks">Send to QuickBooks</button>
        <button type="button" data-pro="push-xero">Send to Xero</button>
      </div>
      <div class="panel" id="proPanel" hidden></div>

      <div class="nudge" id="nudge">
        <span>Did this convert correctly?</span>
        <button type="button" data-quick="yes">Yes</button>
        <button type="button" data-quick="no">Something was wrong</button>
        <a href="{{root}}feedback/">Suggest an improvement</a>
      </div>

      <div class="table-wrap">
        <table id="table">
          <thead><tr><th>Date</th><th>Description</th><th class="num">Money out</th><th class="num">Money in</th><th class="num">Balance</th><th>Category</th><th>Check</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>
