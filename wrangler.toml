# One Cloudflare Worker serves everything: the static site (dist/), the API (/api/*),
# inbound email (Email Routing) and scheduled jobs. Needs Workers Paid ($5/month):
# server-side PDF parsing (email import, folder import, API) exceeds the free plan's CPU limit.
name = "statementotter"
main = "server/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "404-page"
# The Worker runs first for the API and for the embed page (which gets per-firm frame-ancestors).
run_worker_first = ["/api/*", "/embed/*"]

[limits]
cpu_ms = 60000

[[d1_databases]]
binding = "DB"
database_name = "statementotter"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[[r2_buckets]]
binding = "FILES"
bucket_name = "statementotter-uploads"

[triggers]
# every 15 minutes: Dropbox / Google Drive folder import. 03:00 UTC daily: delete old uploads and expired rows.
crons = ["*/15 * * * *", "0 3 * * *"]

[vars]
BRAND = "StatementOtter"
SITE_URL = "https://statementotter.com"
INBOX_DOMAIN = "statementotter.com"
MAIL_FROM = "StatementOtter <hello@statementotter.com>"
# Features built but waiting on third-party approval. Set to "1" once approved.
FEATURE_ACCOUNTINGPUSH = "0"
FEATURE_GOOGLEDRIVE = "0"
QBO_SANDBOX = "0"

# Secrets (set with: npx wrangler secret put NAME). See README "Environment" for what each one is.
#   ENC_KEY                 32 random bytes, base64 (encrypts OAuth tokens and client links)
#   EXPORT_TOKEN, IP_SALT   weekly feedback export / spam protection
#   RESEND_API_KEY          sign-in and notification emails
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
#   STRIPE_PRICE_PRO_MONTH, STRIPE_PRICE_PRO_YEAR, STRIPE_PRICE_FIRM_MONTH, STRIPE_PRICE_FIRM_YEAR
#   REVENUECAT_WEBHOOK_SECRET
#   ANTHROPIC_API_KEY       AI categorization
#   DROPBOX_APP_KEY, DROPBOX_APP_SECRET
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
#   QBO_CLIENT_ID, QBO_CLIENT_SECRET, XERO_CLIENT_ID, XERO_CLIENT_SECRET
