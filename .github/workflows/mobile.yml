# Builds and tests the iOS and Android app (mobile/). Free on GitHub Actions within the
# monthly minutes; the macOS job counts 10x, so it runs only for the mobile branch,
# pull requests that touch the app, and by hand.
name: Mobile app

on:
  push:
    branches: [mobile]
    paths: ['mobile/**', 'src/core/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'src/core/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (unit + browser battle test)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: npm test
        working-directory: mobile
      - run: npm run build
        working-directory: mobile
      - name: Make scanned and photographed samples
        run: |
          pip install pillow numpy pypdf
          sudo apt-get install -y poppler-utils
          python3 mobile/scripts/make_photo_samples.py test/samples /tmp/sr-img
      - name: Browser battle test (phone and tablet sizes)
        working-directory: mobile
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node test/e2e.mjs /tmp/sr-img --shots=/tmp/sr-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: /tmp/sr-shots, if-no-files-found: ignore }

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm ci && npm run build && npx cap sync android
        working-directory: mobile
      - run: ./gradlew --no-daemon assembleDebug lintDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-lint, path: mobile/android/app/build/reports/lint-results-debug.html, if-no-files-found: ignore }

  ios:
    name: iOS build (simulator, unsigned)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm ci && npm run build && npx cap sync ios
        working-directory: mobile
      - name: Build for the iOS simulator
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -50
          test ${PIPESTATUS[0]} -eq 0
